name: Build signed and notarized macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build release executable
        run: xcrun swift build -c release
      - name: Stage architecture
        run: |
          mkdir -p artifact
          cp "$(xcrun swift build -c release --show-bin-path)/VoiceFeedMac" \
            "artifact/VoiceFeedMac-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-feed-${{ matrix.arch }}
          path: artifact/VoiceFeedMac-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign and notarize universal app
    needs: build
    runs-on: macos-15
    timeout-minutes: 25
    env:
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_PRIVATE_KEY_P8: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_P8 }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: voice-feed-*
          path: architectures
          merge-multiple: true
      - name: Import Developer ID certificate
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/voice-feed-signing.keychain-db"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 1200 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" \
            | grep -F "$APPLE_SIGNING_IDENTITY"
          rm -f "$certificate"
      - name: Assemble, sign, and notarize universal bundle
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          app="Voice Feed.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create \
            architectures/VoiceFeedMac-arm64 \
            architectures/VoiceFeedMac-x86_64 \
            -output "$app/Contents/MacOS/VoiceFeedMac"
          chmod 755 "$app/Contents/MacOS/VoiceFeedMac"
          cp Info.plist "$app/Contents/Info.plist"
          lipo -archs "$app/Contents/MacOS/VoiceFeedMac" \
            | grep -q 'x86_64 arm64\|arm64 x86_64'
          codesign --force --deep --options runtime --timestamp \
            --entitlements Entitlements.plist --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          upload="$RUNNER_TEMP/Voice-Feed-$version-notarization.zip"
          ditto -c -k --keepParent "$app" "$upload"
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_P8" > "$key"
          /usr/bin/python3 scripts/run_with_timeout.py 1000 xcrun notarytool submit "$upload" \
            --key "$key" --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" --wait --timeout 15m
          rm -f "$key"
          /usr/bin/python3 scripts/run_with_timeout.py 180 xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          /usr/bin/python3 scripts/run_with_timeout.py 180 spctl --assess \
            --type execute --verbose=2 "$app"
          mkdir -p dist
          artifact="dist/Voice-Feed-$version.zip"
          ditto -c -k --keepParent "$app" "$artifact"
          shasum -a 256 "$artifact" | tee "$artifact.sha256"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
        id: package
      - uses: actions/upload-artifact@v4
        with:
          name: voice-feed-signed-notarized
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.artifact }}.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 scripts/run_with_timeout.py 60 gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
      - name: Delete temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/voice-feed-signing.keychain-db" || true
