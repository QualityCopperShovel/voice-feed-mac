name: Build standalone FairyStack Companion
on:
  workflow_dispatch:
    inputs:
      source_base64:
        description: Credential-free gzip tar of FairyStack native/mac (small sources only)
        required: false
        type: string
      source_url:
        description: Published FairyStack source archive (https://fairystack.com/assets/FairyStack-Companion-*-source.*.zip)
        required: false
        type: string
      source_sha256:
        description: SHA-256 of archive
        required: true
        type: string
      source_revision:
        description: Canonical FairyStack source revision
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - name: Verify canonical source archive
        working-directory: .
        env:
          SOURCE: ${{ inputs.source_base64 }}
          SOURCE_URL: ${{ inputs.source_url }}
          SHA: ${{ inputs.source_sha256 }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,os,pathlib,re,tarfile,urllib.request,zipfile
          assert re.fullmatch('[a-f0-9]{40}',os.environ['REVISION'])
          url=os.environ.get('SOURCE_URL','')
          if url:
              assert not os.environ.get('SOURCE'), 'Provide source_url or source_base64, not both'
              assert re.fullmatch(r'https://fairystack\.com/assets/FairyStack-Companion-[0-9.]+-source\.[0-9]+\.zip',url)
              with urllib.request.urlopen(url,timeout=30) as response: data=response.read(2_000_001)
              assert len(data)<=2_000_000 and hashlib.sha256(data).hexdigest()==os.environ['SHA']
              prefix=url.rsplit('/',1)[1][:-len('.zip')]+'/'
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  for item in archive.infolist():
                      p=pathlib.PurePosixPath(item.filename)
                      assert item.filename.startswith(prefix) and not p.is_absolute() and '..' not in p.parts
                      if item.is_dir(): continue
                      target=pathlib.Path('client',*p.parts[1:]); target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(archive.read(item))
          else:
              data=base64.b64decode(os.environ['SOURCE'],validate=True)
              assert len(data)<48000 and hashlib.sha256(data).hexdigest()==os.environ['SHA']
              with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
                  for item in archive.getmembers():
                      p=pathlib.PurePosixPath(item.name)
                      assert not p.is_absolute() and '..' not in p.parts and (item.isfile() or item.isdir())
                  archive.extractall('client')
          pathlib.Path('client/source-receipt.txt').write_text('revision='+os.environ['REVISION']+'\nsha256='+os.environ['SHA']+'\n')
          PY
      - name: Test process ownership and package contracts
        run: python3 -m unittest discover -s tests -v
      - name: Native window tests (WebKit routing, file promises)
        run: |
          if [ -d Tests ]; then xcrun swift test; fi
      - name: Build and exercise launch
        run: |
          xcrun swift build -c release
          binary="$(xcrun swift build -c release --show-bin-path)/FairyStackCompanion"
          python3 tests/check_launch.py "$binary"
          mkdir -p dist
          cp "$binary" "dist/FairyStackCompanion-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.arch }}
          path: client/dist/*
          retention-days: 7
  sign:
    needs: build
    runs-on: macos-15
    timeout-minutes: 25
    env:
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_PRIVATE_KEY_P8: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_P8 }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    defaults:
      run:
        working-directory: client
    steps:
      - name: Verify canonical source archive
        working-directory: .
        env:
          SOURCE: ${{ inputs.source_base64 }}
          SOURCE_URL: ${{ inputs.source_url }}
          SHA: ${{ inputs.source_sha256 }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,os,pathlib,re,tarfile,urllib.request,zipfile
          assert re.fullmatch('[a-f0-9]{40}',os.environ['REVISION'])
          url=os.environ.get('SOURCE_URL','')
          if url:
              assert not os.environ.get('SOURCE'), 'Provide source_url or source_base64, not both'
              assert re.fullmatch(r'https://fairystack\.com/assets/FairyStack-Companion-[0-9.]+-source\.[0-9]+\.zip',url)
              with urllib.request.urlopen(url,timeout=30) as response: data=response.read(2_000_001)
              assert len(data)<=2_000_000 and hashlib.sha256(data).hexdigest()==os.environ['SHA']
              prefix=url.rsplit('/',1)[1][:-len('.zip')]+'/'
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  for item in archive.infolist():
                      p=pathlib.PurePosixPath(item.filename)
                      assert item.filename.startswith(prefix) and not p.is_absolute() and '..' not in p.parts
                      if item.is_dir(): continue
                      target=pathlib.Path('client',*p.parts[1:]); target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(archive.read(item))
          else:
              data=base64.b64decode(os.environ['SOURCE'],validate=True)
              assert len(data)<48000 and hashlib.sha256(data).hexdigest()==os.environ['SHA']
              with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
                  for item in archive.getmembers():
                      p=pathlib.PurePosixPath(item.name)
                      assert not p.is_absolute() and '..' not in p.parts and (item.isfile() or item.isdir())
                  archive.extractall('client')
          pathlib.Path('client/source-receipt.txt').write_text('revision='+os.environ['REVISION']+'\nsha256='+os.environ['SHA']+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: companion-*
          path: client/architectures
          merge-multiple: true
      - name: Import signing identity
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/companion.p12"
          keychain="$RUNNER_TEMP/companion.keychain-db"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 1200 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"
      - name: Assemble standalone app, sign and notarize
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          app="FairyStack Companion.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" AppIcon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" Resources/AppIcon.png --out "AppIcon.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" Resources/AppIcon.png --out "AppIcon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$app/Contents/Resources/AppIcon.icns"
          lipo -create architectures/FairyStackCompanion-arm64 architectures/FairyStackCompanion-x86_64 -output "$app/Contents/MacOS/FairyStackCompanion"
          chmod 755 "$app/Contents/MacOS/FairyStackCompanion"
          cp Info.plist "$app/Contents/Info.plist"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          upload="$RUNNER_TEMP/companion-notarization.zip"
          ditto -c -k --keepParent "$app" "$upload"
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_P8" > "$key"
          python3 scripts/run_with_timeout.py 1000 xcrun notarytool submit "$upload" --key "$key" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait --timeout 15m
          rm -f "$key"
          python3 scripts/run_with_timeout.py 180 xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          python3 scripts/run_with_timeout.py 180 spctl --assess --type execute --verbose=2 "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/FairyStack-Companion-$version.zip"
          shasum -a 256 dist/*.zip > dist/archive.sha256
          cp source-receipt.txt dist/
      - uses: actions/upload-artifact@v4
        with:
          name: fairystack-companion-signed
          path: client/dist/*
          retention-days: 30
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/companion.keychain-db" || true
