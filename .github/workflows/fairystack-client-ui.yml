name: Exercise Windows and Android client UIs

on:
  workflow_dispatch:
    inputs:
      android_source_base64:
        description: Checksummed gzip tar of canonical Android source
        required: true
        type: string
      android_source_sha256:
        required: true
        type: string
      android_source_revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pywinauto==0.6.9 Pillow==11.3.0 cryptography==46.0.1
      - name: Install published client and interact with its window
        run: python scripts/client-ui/windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify canonical source and prepare emulator
        env:
          SOURCE_BASE64: ${{ inputs.android_source_base64 }}
          SOURCE_SHA256: ${{ inputs.android_source_sha256 }}
          SOURCE_REVISION: ${{ inputs.android_source_revision }}
        run: |
          python3 scripts/client-ui/android.py prepare
          sudo chmod a+rw /dev/kvm
          timeout 300 bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/client-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n client-ui -k 'system-images;android-35;google_apis;x86_64' --path "$ANDROID_AVD_HOME/client-ui.avd" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee evidence/avds.txt
          grep -qx client-ui evidence/avds.txt
          "$ANDROID_HOME/emulator/emulator" -avd client-ui -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > evidence/emulator.log 2>&1 &
      - name: Build isolated test-signed client and run device interactions
        run: python3 scripts/client-ui/android.py test
      - name: Stop emulator
        if: always()
        run: timeout 10 adb emu kill || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
